<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Lab Board</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">BUILD · TEST · LEARN</span><h1>Student Lab Board</h1>
      <p>A small space for your next experiment.</p></header>
    <aside>This is a local learning demo. Everyone on this server shares one board; restarting it resets the data.</aside>
    <form id="add-form">
      <label for="title">What would you like to try?</label>
      <div class="input-row"><input id="title" name="title" maxlength="100" required placeholder="e.g. Add a search filter"><button id="add-button" type="submit">Add experiment</button></div>
    </form>
    <section aria-labelledby="board-heading">
      <div class="section-heading"><h2 id="board-heading">Your experiments</h2><span id="count"></span></div>
      <p id="status" role="status" aria-live="polite">Loading experiments…</p>
      <button id="retry" type="button" hidden>Try again</button>
      <ul id="experiments"></ul>
    </section>
    <footer>Start small. Change one thing. Observe what happens.</footer>
  </main>
</body>
</html>
