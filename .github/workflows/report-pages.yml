name: Publish report example
on:
  push:
    branches: [main]
    paths:
      - docs/examples/**
      - .github/workflows/report-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: report-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/examples
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
